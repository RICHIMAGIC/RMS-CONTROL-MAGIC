
name: RMS CONTROL MAGIC - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "richi-rms-control-magic-cloud-build.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Aceptar licencias e instalar Android SDK 35
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto Android
        shell: bash
        run: |
          set -e
          mkdir -p source
          unzip -o richi-rms-control-magic-cloud-build.zip -d source

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          GRADLEW="$(find "$GITHUB_WORKSPACE/source" -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
          APK="$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No se generó la APK"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$APK" "$GITHUB_WORKSPACE/artifact/RMS-CONTROL-MAGIC.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RMS-CONTROL-APK
          path: artifact/RMS-CONTROL-MAGIC.apk
          if-no-files-found: error
          
