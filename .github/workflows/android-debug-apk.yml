name: RMS CONTROL MAGIC - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "richi-rms-control-magic-cloud-build.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Aceptar licencias Android SDK
        run: yes | sdkmanager --licenses

      - name: Instalar Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto Android
        run: |
          mkdir -p source
          unzip -o richi-rms-control-magic-cloud-build.zip -d source

      - name: Compilar APK
        run: |
          chmod +x source/gradlew
          cd source
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RMS-CONTROL-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
